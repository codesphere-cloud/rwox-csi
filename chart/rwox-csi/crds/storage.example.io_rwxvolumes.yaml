apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rwxvolumes.storage.example.io
spec:
  group: storage.example.io
  scope: Cluster
  names:
    plural: rwxvolumes
    singular: rwxvolume
    kind: RWXVolume
    shortNames: [rwxv]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Capacity, type: string, jsonPath: .status.capacity}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [capacity, backing]
              properties:
                capacity: {type: string, pattern: '^[0-9]+([EPTGMK]i?)?$'}
                backing:
                  type: object
                  required: [storageClassName]
                  properties:
                    storageClassName: {type: string, minLength: 1}
                nfs:
                  type: object
                  properties:
                    version: {type: string, enum: ["4.1"]}
                    exportPath: {type: string, enum: ["/"]}
                    directoryMode: {type: string, pattern: '^0[0-7]{3}$'}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
