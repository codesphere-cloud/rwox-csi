apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rwox-csi-controller
rules:
  - apiGroups: ["storage.example.io"]
    resources: ["rwxvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rwox-csi-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rwox-csi-controller}
subjects:
  - {kind: ServiceAccount, name: rwox-csi-controller, namespace: {{ include "rwox.namespace" . }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rwox-csi-node
rules:
  - apiGroups: ["storage.example.io"]
    resources: ["rwxvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rwox-csi-node
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rwox-csi-node}
subjects:
  - {kind: ServiceAccount, name: rwox-csi-node, namespace: {{ include "rwox.namespace" . }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rwox-csi-operator
rules:
  - apiGroups: ["storage.example.io"]
    resources: ["rwxvolumes", "rwxvolumes/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.example.io"]
    resources: ["rwxvolumes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rwox-csi-operator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rwox-csi-operator}
subjects:
  - {kind: ServiceAccount, name: rwox-csi-operator, namespace: {{ include "rwox.namespace" . }}}
