{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
provisioner: rwox.storage.example.io
parameters:
  backingStorageClass: {{ required "storageClass.backingStorageClass is required" .Values.storageClass.backingStorageClass | quote }}
{{- with .Values.storageClass.directoryMode }}
  directoryMode: {{ . | quote }}
{{- end }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
allowVolumeExpansion: true
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
mountOptions:
{{- toYaml .Values.storageClass.mountOptions | nindent 2 }}
{{- end }}
