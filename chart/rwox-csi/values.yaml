namespace: rwx-csi-system
clusterDomain: cluster.local

images:
  controller: rwox-csi:latest
  node: rwox-csi:latest
  operator: rwox-csi:latest
  ganesha: quay.io/nfs-ganesha/nfs-ganesha:latest
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
  resizer: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
  registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
imagePullPolicy: IfNotPresent

storageClass:
  create: true
  name: rwox
  backingStorageClass: standard
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  mountOptions:
    - nfsvers=4.1
    - hard

controller:
  replicas: 1
operator:
  replicas: 1
