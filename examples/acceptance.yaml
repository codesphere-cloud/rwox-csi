apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwox-acceptance
spec:
  accessModes: [ReadWriteMany]
  storageClassName: rwox
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwox-acceptance
spec:
  replicas: 2
  selector:
    matchLabels: {app: rwox-acceptance}
  template:
    metadata:
      labels: {app: rwox-acceptance}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: rwox-acceptance}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: busybox:1.37
          command: [sh, -c]
          args: ['while true; do date > "/data/${HOSTNAME}"; sleep 5; done']
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rwox-acceptance}
